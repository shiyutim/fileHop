name: Build and Release CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to build and publish (for example, v0.1.0); leave empty to only build"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
          - platform: macos-latest
            target: x86_64-apple-darwin
            bundles: dmg
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
    steps:
      - name: Preserve repository line endings on Windows
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.sha }}
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Check application and release versions
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
        with:
          script: |
            const { execFileSync } = require('node:child_process');
            const { version } = require('./package.json');
            const tauri = require('./src-tauri/tauri.conf.json');
            const metadata = JSON.parse(execFileSync('cargo', [
              'metadata', '--format-version', '1', '--no-deps', '--locked',
              '--manifest-path', 'src-tauri/Cargo.toml',
            ], { encoding: 'utf8' }));
            const crate = metadata.packages.find(item => item.name === 'filehop');
            if (tauri.version !== version || crate?.version !== version) {
              throw new Error('Versions in package.json, tauri.conf.json and Cargo.toml must match');
            }
            const tag = process.env.RELEASE_TAG;
            if (tag && tag !== `v${version}`) {
              throw new Error(`Tag ${tag} does not match application version v${version}`);
            }

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev patchelf libfuse2 xdg-utils

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Test release build script
        run: pnpm test:build

      - name: Test backend
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Build installers
        env:
          # Use ad-hoc signing until an Apple distribution certificate is configured.
          APPLE_SIGNING_IDENTITY: "-"
        run: pnpm build:desktop --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} -- --locked

      - name: Test UI
        if: runner.os == 'Linux'
        run: node tests/ui/run.mjs

      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: FileHop-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: FileHop-*
          path: installers
          merge-multiple: true

      - name: Create or update release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: FileHop ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(inputs.tag || github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: |
            installers/**/*.dmg
            installers/**/*.exe
            installers/**/*.deb
            installers/**/*.AppImage
